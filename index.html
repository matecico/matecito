<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MateCico - Tienda de Mates</title>
  
  <style>
    /* RESET GLOBAL Y ENLACES */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
      width: 100%;
    }

    a, a:visited, a:hover, a:active {
      text-decoration: none !important;
      color: inherit !important;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    /* NAVBAR RESPONSIVE */
    .navbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 10px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      gap: 12px;
      width: 100%;
    }

    .navbar-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .logo-img {
      width: 38px !important;
      height: 38px !important;
      object-fit: cover !important;
      border-radius: 50%;
    }

    .nav-links {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-links a {
      color: #cccccc !important;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .nav-links a:hover {
      color: #25d366 !important;
    }

    /* HERO SECTION */
    .hero {
      text-align: center;
      padding: 35px 20px;
      background-color: #181818;
      border-bottom: 1px solid #252525;
    }

    .hero h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .hero p {
      color: #aaaaaa;
      margin-bottom: 18px;
      font-size: 0.95rem;
    }

    .btn-hero {
      display: inline-block;
      background-color: #25d366;
      color: #000000 !important;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
    }

    /* BARRA DE BÚSQUEDA */
    .buscador-container {
      margin: 0 auto 25px auto;
      width: 100%;
      padding: 0 10px;
      box-sizing: border-box;
    }

    .input-busqueda {
      width: 100%;
      padding: 14px 20px;
      font-size: 1rem;
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #333333;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
      max-width: 100%;
    }

    .input-busqueda:focus {
      border-color: #25d366;
      box-shadow: 0 0 8px rgba(37, 211, 102, 0.3);
    }

    .input-busqueda::placeholder {
      color: #888888;
    }

    /* CONTENEDOR PRINCIPAL Y GRILLA */
    .contenedor-principal {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .titulo-seccion {
      font-size: 1.5rem;
      color: #ffffff;
      margin-bottom: 20px;
    }

    #contenedor-productos, .productos-grid {
      display: grid !important;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) !important;
      gap: 25px !important;
      width: 100% !important;
    }

    #contenedor-productos > div, .card-producto, .producto {
      background-color: #1e1e1e !important;
      border: 1px solid #2a2a2a !important;
      border-radius: 10px !important;
      padding: 15px !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      align-items: center !important;
      text-align: center !important;
      width: 100% !important;
      margin: 0 !important;
      height: 100%;
    }

    .card-producto img, .producto img, #contenedor-productos img {
      max-width: 100% !important;
      max-height: 170px !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
      display: block;
      margin: 0 auto 10px auto;
    }

    .card-producto h3, .producto h3, #contenedor-productos h3 {
      font-size: 1rem !important;
      color: #ffffff !important;
      margin: 8px 0 !important;
      line-height: 1.3 !important;
      font-weight: 600;
    }

    .precio, .precio-lista {
      font-size: 1.1rem !important;
      font-weight: bold !important;
      color: #ffffff !important;
      margin: 5px 0 !important;
    }

    .precio-descuento, .transferencia {
      font-size: 0.85rem !important;
      color: #25d366 !important;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .card-producto button, .producto button, .btn-agregar, #contenedor-productos button {
      background-color: #25d366 !important;
      color: #000000 !important;
      border: none !important;
      padding: 12px 15px !important;
      border-radius: 6px !important;
      font-weight: bold !important;
      font-size: 0.85rem !important;
      cursor: pointer !important;
      width: 100% !important;
      margin-top: 10px !important;
    }

    /* ESTILOS PARA COMPUTADORAS (Escritorio) */
    @media (min-width: 769px) {
      .navbar {
        flex-direction: row;
        justify-content: space-between;
        padding: 15px 30px;
      }
      .nav-links {
        gap: 25px;
      }
      .nav-links a {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">
        <img src="img/logo.jpg" alt="MateCico" class="logo-img">
        <span>MateCico</span>
      </a>
      <div class="nav-links">
        <a href="index.html">INICIO</a>
        <a href="#productos">PRODUCTOS</a>
        <a href="contacto.html">CONTACTO</a>
        <a href="carrito.html">🛒 CARRITO</a>
      </div>
    </nav>
  </header>

  <section class="hero">
    <h1>Bienvenido a MateCico</h1>
    <p>Encontrá los mejores mates, bombillas y termos para tu día a día.</p>
    <a href="#productos" class="btn-hero">Ver Catálogo</a>
  </section>

  <main class="contenedor-principal">
    <h2 id="productos" class="titulo-seccion">Productos Destacados</h2>
    
    <!-- BARRA DE BÚSQUEDA -->
    <div class="buscador-container">
      <input 
        type="text" 
        id="input-busqueda" 
        class="input-busqueda" 
        placeholder="Buscar productos (ej: mate, termo, peluche, alpaca)..."
      >
    </div>

    <div id="contenedor-productos" class="productos-grid">
      <!-- Carga dinámicamente desde JS -->
    </div>
  </main>

  <script src="js/productos.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
